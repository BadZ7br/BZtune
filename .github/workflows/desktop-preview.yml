name: Desktop Windows - Gerar instalador de teste

on:
  push:
    branches: [feature/desktop-v2, codex/desktop-maintenance-2026-11-08]
    paths:
      - "desktop/**"
      - "doomvault/**"
      - "doomvault-api/**"
      - ".github/workflows/desktop-preview.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "doomvault/**"
      - ".github/workflows/desktop-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-preview-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Compilar instalador NSIS sem publicação
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: doomvault/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: doomvault-api/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Instalar dependências Node
        shell: pwsh
        run: |
          npm --prefix doomvault ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci falhou." }
          Push-Location desktop
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm desktop falhou." }
          Pop-Location
      - name: Verificar JavaScript do atualizador
        shell: pwsh
        run: |
          node --check doomvault/public/desktop-updates.js
          if ($LASTEXITCODE -ne 0) { throw "Sintaxe do atualizador invalida." }
      - name: Testar comportamento do atualizador sem Release
        shell: pwsh
        run: |
          node --test tests/desktop-updates.test.mjs tests/queue-behavior.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Fluxo do atualizador falhou." }
      - name: Preparar sidecar e recursos
        shell: pwsh
        run: ./desktop/scripts/prepare_windows.ps1
      - name: Testar restauração e recuperação
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_backup_consistency.py -v
          if ($LASTEXITCODE -ne 0) { throw "Consistência do backup falhou." }
          python -m unittest discover -s tests -p test_restore_transaction.py -v
          if ($LASTEXITCODE -ne 0) { throw "Recuperação de restauração falhou." }
          rustc --edition=2021 --test desktop/src-tauri/src/restore_process.rs -o "$env:RUNNER_TEMP/restore-tests.exe"
          if ($LASTEXITCODE -ne 0) { throw "Compilação do supervisor falhou." }
          & "$env:RUNNER_TEMP/restore-tests.exe"
          if ($LASTEXITCODE -ne 0) { throw "Supervisor falhou." }
      - name: Verificar sintaxe Python
        shell: pwsh
        run: python -m py_compile desktop/backend_entry.py
      - name: Isolar aplicativo e dados de teste
        shell: python
        run: |
          import json, pathlib
          path = pathlib.Path('desktop/src-tauri/tauri.conf.json')
          config = json.loads(path.read_text())
          config['productName'] = 'BZtune Preview'
          config['identifier'] = 'com.bztune.desktop.preview'
          config['app']['windows'][0]['title'] = 'BZtune Preview — teste'
          path.write_text(json.dumps(config, ensure_ascii=False, indent=2), encoding='utf-8')
      - name: Compilar Tauri NSIS (não assinado para distribuição)
        env:
          BZTUNE_DESKTOP_PREVIEW: '1' 
        shell: pwsh
        run: |
          Push-Location desktop
          npm run tauri -- build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "Falha no build Tauri." }
          Pop-Location
      - name: Validar instalador
        shell: pwsh
        run: |
          $files = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter "*-setup.exe")
          if ($files.Count -ne 1) { throw "Esperado exatamente um instalador NSIS." }
          Write-Host "NSIS compilado:" $files[0].Name $files[0].Length
      - uses: actions/upload-artifact@v6
        with:
          name: BZtune-Desktop-Windows-Preview
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
