name: Desktop - Publicar instalador e atualizações

on:
  push:
    branches: [main]
    paths: ["desktop/release-request.json"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a assinar (teste: 2.0.0-rc.1; publicação: 2.0.0)"
        required: true
        type: string
      publish:
        description: "Publicar Release oficial? Desmarcado = só baixar artefato assinado."
        type: boolean
        required: true
        default: false
      release_confirmation:
        description: 'Somente para publicar: digite PUBLICAR v2.0.0 (ajuste para a versão).'
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: bztune-desktop-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: desktop-release
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolver versao e confirmar origem da publicacao
        id: release
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
          REQUESTED_CONFIRMATION: ${{ inputs.release_confirmation }}
        run: |
          $version = $env:REQUESTED_VERSION
          $publish = $env:REQUESTED_PUBLISH
          $confirmation = $env:REQUESTED_CONFIRMATION
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $requestJson = python desktop/scripts/release_request.py
            if ($LASTEXITCODE -ne 0) { throw 'Pedido de publicacao invalido. Publicacao bloqueada.' }
            $request = $requestJson | ConvertFrom-Json
            $version = $request.version
            $publish = $request.publish
            $confirmation = $request.confirmation
          }
          if ($version -notmatch '^2\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Versao invalida.' }
          if ($publish -notin @('true', 'false')) { throw 'Modo de publicacao invalido.' }
          if ($publish -eq 'true' -and $version -notmatch '^2\.\d+\.\d+$') { throw 'Publicacao exige versao estavel.' }
          if ($publish -eq 'true' -and $confirmation -cne "PUBLICAR v$version") { throw 'Confirmacao de publicacao invalida.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          "confirmation=$confirmation" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Verificar pré-requisitos de assinatura e publicação
        shell: pwsh
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          BZTUNE_UPDATER_PUBLIC_KEY: ${{ secrets.BZTUNE_UPDATER_PUBLIC_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISH: ${{ steps.release.outputs.publish }}
          RELEASE_CONFIRMATION: ${{ steps.release.outputs.confirmation }}
        run: |
          if (-not $env:PRIVATE_KEY -or -not $env:BZTUNE_UPDATER_PUBLIC_KEY) { throw "Credenciais de release não configuradas; publicação bloqueada." }
          if ($env:VERSION -notmatch '^2\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw "Versão inválida: use 2.0.0-rc.1 para teste ou 2.0.0 para Release." }
          if ($env:PUBLISH -eq 'true' -and $env:VERSION -notmatch '^2\.\d+\.\d+$') { throw "Release oficial exige uma versão estável, ex.: 2.0.0." }
          if ($env:PUBLISH -eq 'true' -and $env:RELEASE_CONFIRMATION -cne "PUBLICAR v$env:VERSION") { throw "Publicação bloqueada: preencha a confirmação exata PUBLICAR v$env:VERSION." }
      - name: Validar formato da chave pública Tauri antes do build
        shell: pwsh
        env:
          BZTUNE_UPDATER_PUBLIC_KEY: ${{ secrets.BZTUNE_UPDATER_PUBLIC_KEY }}
        run: |
          python desktop/scripts/prepare_signing.py --check-public-key
          if ($LASTEXITCODE -ne 0) { throw "Secret BZTUNE_UPDATER_PUBLIC_KEY inválido; confira o conteúdo do arquivo .key.pub." }
      - name: Instalar dependências Node
        shell: pwsh
        run: |
          Push-Location doomvault
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "Falha no npm ci." }
          Pop-Location
          Push-Location desktop
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "Falha instalando Tauri." }
          Pop-Location
      - name: Testes da aplicação
        shell: pwsh
        run: |
          python -m pip install -r desktop/requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { throw "Dependências Python falharam." }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Testes falharam." }
          $nodeTests = @(Get-ChildItem tests -Filter '*.test.mjs' | ForEach-Object { $_.FullName })
          node --test @nodeTests
          if ($LASTEXITCODE -ne 0) { throw "Teste do atualizador falhou. Publicação bloqueada." }
          Push-Location doomvault
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Build React falhou." }
          Pop-Location
      - name: Validar player e letras no navegador
        shell: pwsh
        run: |
          Push-Location doomvault
          npm install --no-save --package-lock=false playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Falha instalando o teste de navegador.' }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Falha instalando o Chromium.' }
          Pop-Location
          $server = Start-Process -FilePath node -ArgumentList @('node_modules/vite/bin/vite.js', '--host', '127.0.0.1', '--port', '5173', '--strictPort') -WorkingDirectory "$PWD/doomvault" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/bztune-vite.log" -RedirectStandardError "$env:RUNNER_TEMP/bztune-vite-error.log"
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try { $null = Invoke-WebRequest 'http://127.0.0.1:5173' -TimeoutSec 1; $ready = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Frontend de teste nao iniciou.' }
            node tests/browser/lyrics-regression.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Regressao nas letras. Publicacao bloqueada.' }
            node tests/browser/lyrics-auto-lookup.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Regressao na busca automatica de letras. Publicacao bloqueada.' }
            node tests/browser/lyrics-clock.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Regressao no relogio de letras. Publicacao bloqueada.' }
            node tests/browser/browser-backup.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Regressao na exportacao e restauracao do JSON. Publicacao bloqueada.' }
            node tests/browser/playlist-deadlines.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Regressao nos prazos de playlists e fila. Publicacao bloqueada.' }
            node tests/browser/frontend-contracts.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Regressao no isolamento de respostas invalidas. Publicacao bloqueada.' }
            node tests/browser/home-cards.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Regressao nos cartoes e acoes da biblioteca recente. Publicacao bloqueada.' }
            node tests/browser/expanded-player-layout.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Regressao no layout do player expandido. Publicacao bloqueada.' }
            node tests/browser/online-player-recovery.cjs
            if ($LASTEXITCODE -ne 0) { throw 'Regressao no player. Publicacao bloqueada.' }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
      - name: Verificar interoperabilidade Rust e Python no Windows
        shell: pwsh
        run: |
          cargo test --locked --manifest-path desktop/native-core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Serviços nativos falharam." }
          cargo build --locked --manifest-path desktop/native-core/Cargo.toml --example playlist_service
          if ($LASTEXITCODE -ne 0) { throw "Bridge de teste não compilou." }
          python scripts/check_native_playlists.py desktop/native-core/target/debug/examples/playlist_service.exe
          if ($LASTEXITCODE -ne 0) { throw "Interoperabilidade Windows falhou. Publicação bloqueada." }
      - name: Empacotar Flask e FFmpeg
        shell: pwsh
        run: |
          $packLog = Join-Path $env:RUNNER_TEMP 'bztune-packaging.log'
          try {
            & ./desktop/scripts/prepare_windows.ps1 *> $packLog
            if ($LASTEXITCODE -ne 0) { throw 'Empacotamento retornou falha.' }
            Get-Content $packLog | Select-Object -Last 12
          } catch {
            '### Falha ao empacotar backend e FFmpeg' >> $env:GITHUB_STEP_SUMMARY
            'Esta etapa ainda nao recebe as chaves de assinatura.' >> $env:GITHUB_STEP_SUMMARY
            '```text' >> $env:GITHUB_STEP_SUMMARY
            if (Test-Path $packLog) { Get-Content $packLog -Tail 60 >> $env:GITHUB_STEP_SUMMARY }
            ($_ | Out-String) >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
            throw
          }
      - name: Preparar chaves públicas e versão
        shell: pwsh
        env:
          BZTUNE_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          BZTUNE_UPDATER_PUBLIC_KEY: ${{ secrets.BZTUNE_UPDATER_PUBLIC_KEY }}
        run: python desktop/scripts/prepare_signing.py
      - name: Compilar instalador e atualização assinada
        shell: pwsh
        env:
          BZTUNE_RELEASE_SIGNED: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          Push-Location desktop
          npm run tauri -- build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "Tauri NSIS falhou." }
          Pop-Location
      - name: Preparar feed latest.json
        shell: pwsh
        env:
          BZTUNE_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python desktop/scripts/make_release_feed.py desktop/src-tauri/target/release/bundle/nsis $env:BZTUNE_RELEASE_VERSION latest.json
          if ($LASTEXITCODE -ne 0) { throw "Feed inválido; sem publicação." }
          python -c "import json; from pathlib import Path; path=Path('latest.json'); data=json.loads(path.read_text(encoding='utf-8')); data['notes']=Path('desktop/release-notes.md').read_text(encoding='utf-8'); path.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { throw "Notas da atualização inválidas; sem publicação." }
      - name: Validar pacote, assinatura criptográfica e feed HTTPS
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PUBLISH: ${{ steps.release.outputs.publish }}
          BZTUNE_UPDATER_PUBLIC_KEY: ${{ secrets.BZTUNE_UPDATER_PUBLIC_KEY }}
        run: |
          $folder = "desktop/src-tauri/target/release/bundle/nsis"
          if ($env:PUBLISH -eq 'true') {
            python desktop/scripts/validate_release_bundle.py $folder $env:VERSION latest.json --stable --config desktop/src-tauri/tauri.conf.json
          } else {
            python desktop/scripts/validate_release_bundle.py $folder $env:VERSION latest.json --config desktop/src-tauri/tauri.conf.json
          }
          if ($LASTEXITCODE -ne 0) { throw "Pacote não passou na validação. Publicação bloqueada." }
      - name: Guardar instalador assinado para teste (sem Release)
        if: ${{ steps.release.outputs.publish == 'false' }}
        uses: actions/upload-artifact@v6
        with:
          name: BZtune-Signed-Test-${{ steps.release.outputs.version }}
          retention-days: 7
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/BZtune-Setup-v*.exe
            desktop/src-tauri/target/release/bundle/nsis/BZtune-Setup-v*.exe.sig
            latest.json
      - name: Publicar somente artefatos assinados no repositório público
        if: ${{ steps.release.outputs.publish == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BZTUNE_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $dir = "desktop/src-tauri/target/release/bundle/nsis"
          $exe = @(Get-ChildItem $dir -Filter "BZtune-Setup-v*.exe")
          if ($exe.Count -ne 1 -or -not (Test-Path "$($exe[0].FullName).sig") -or -not (Test-Path "latest.json")) { throw "Arquivos assinados ausentes." }
          gh release create "v$env:BZTUNE_RELEASE_VERSION" $exe[0].FullName "$($exe[0].FullName).sig" "latest.json" --repo BadZ7br/BZtune --target "$env:GITHUB_SHA" --title "BZtune Desktop v$env:BZTUNE_RELEASE_VERSION" --notes-file "desktop/release-notes.md" --latest
          if ($LASTEXITCODE -ne 0) { throw "Publicação falhou." }
