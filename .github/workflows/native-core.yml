name: Native core - Playlists

on:
  push:
    paths:
      - "desktop/native-core/**"
      - "desktop/src-tauri/**"
      - "doomvault-api/**"
      - "doomvault/**"
      - "tests/**"
      - "scripts/check_native_playlists.py"
      - ".github/workflows/native-core.yml"
  pull_request:
    paths:
      - "desktop/native-core/**"
      - "desktop/src-tauri/**"
      - "doomvault-api/**"
      - "doomvault/**"
      - "tests/**"
      - "scripts/check_native_playlists.py"
      - ".github/workflows/native-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: cargo test --locked --manifest-path desktop/native-core/Cargo.toml
      - run: cargo build --locked --manifest-path desktop/native-core/Cargo.toml --example playlist_service
      - run: python -m pip install -r doomvault-api/requirements.txt
      - name: Verify native and Python database compatibility
        shell: bash
        run: |
          bridge=desktop/native-core/target/debug/examples/playlist_service
          if [ "$RUNNER_OS" = "Windows" ]; then bridge="$bridge.exe"; fi
          python scripts/check_native_playlists.py "$bridge"
      - run: npm ci
        working-directory: doomvault
      - name: Python regressions on both platforms
        shell: bash
        run: |
          if ! python -m unittest discover -s tests -v > python-tests.log 2>&1; then
            cat python-tests.log
            python -c "from pathlib import Path; text=Path('python-tests.log').read_text(encoding='utf-8', errors='replace')[-6000:]; print('::error title=Python regression tests::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
          cat python-tests.log
      - name: JavaScript regressions on both platforms
        shell: bash
        run: node --test tests/*.test.mjs
      - run: npm run build
        working-directory: doomvault
      - name: Prepare real desktop resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./desktop/scripts/prepare_windows.ps1
      - name: Compile Tauri command integration on Windows
        if: runner.os == 'Windows'
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
