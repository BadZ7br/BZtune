name: Desktop - Teste local updater RC1 para RC2 (sem Release)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-updater:
    if: github.ref == 'refs/heads/main'
    environment: desktop-release
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Validar chave publica sem revelar segredos
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          BZTUNE_UPDATER_PUBLIC_KEY: ${{ secrets.BZTUNE_UPDATER_PUBLIC_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:BZTUNE_UPDATER_PUBLIC_KEY) {
            throw "Secrets de assinatura ausentes: nenhuma versao de teste sera produzida."
          }
          python desktop/scripts/prepare_signing.py --check-public-key
          if ($LASTEXITCODE -ne 0) { throw "Chave publica Tauri invalida." }

      - name: Instalar dependencias e executar testes
        shell: pwsh
        run: |
          python -m pip install -r doomvault-api/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar dependencias Python." }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Testes Python falharam." }
          Push-Location doomvault
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci falhou." }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Build React falhou." }
          Pop-Location
          Push-Location desktop
          npm install
          if ($LASTEXITCODE -ne 0) { throw "Instalacao do Tauri falhou." }
          Pop-Location

      - name: Empacotar backend e ferramentas de audio
        shell: pwsh
        run: ./desktop/scripts/prepare_windows.ps1

      - name: Build RC1 com endpoint somente local
        shell: pwsh
        env:
          BZTUNE_RELEASE_SIGNED: "1"
          BZTUNE_RELEASE_VERSION: "2.0.0-rc.1"
          BZTUNE_LOCAL_UPDATE_TEST: "1"
          BZTUNE_UPDATER_PUBLIC_KEY: ${{ secrets.BZTUNE_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python desktop/scripts/prepare_signing.py
          if ($LASTEXITCODE -ne 0) { throw "Configuracao RC1 invalida." }
          Push-Location desktop
          npm run tauri -- build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "Build RC1 falhou." }
          Pop-Location

      - name: Guardar RC1 de teste
        shell: pwsh
        run: |
          $dir = "desktop/src-tauri/target/release/bundle/nsis"
          python desktop/scripts/make_release_feed.py $dir 2.0.0-rc.1 "$env:RUNNER_TEMP/rc1.json" --local-loopback
          if ($LASTEXITCODE -ne 0) { throw "Instalador RC1 nao assinado." }
          New-Item -ItemType Directory -Force "updater-test/rc1-client" | Out-Null
          $name = "BZtune-Setup-v2.0.0-rc.1-x64.exe"
          Copy-Item "$dir/$name" "updater-test/rc1-client/$name"
          Copy-Item "$dir/$name.sig" "updater-test/rc1-client/$name.sig"

      - name: Build RC2 com a mesma chave e endpoint local
        shell: pwsh
        env:
          BZTUNE_RELEASE_SIGNED: "1"
          BZTUNE_RELEASE_VERSION: "2.0.0-rc.2"
          BZTUNE_LOCAL_UPDATE_TEST: "1"
          BZTUNE_UPDATER_PUBLIC_KEY: ${{ secrets.BZTUNE_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python desktop/scripts/prepare_signing.py
          if ($LASTEXITCODE -ne 0) { throw "Configuracao RC2 invalida." }
          Push-Location desktop
          npm run tauri -- build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "Build RC2 falhou." }
          Pop-Location

      - name: Preparar o servidor local e a atualizacao assinada
        shell: pwsh
        run: |
          $dir = "desktop/src-tauri/target/release/bundle/nsis"
          New-Item -ItemType Directory -Force "updater-test/update-server" | Out-Null
          python desktop/scripts/make_release_feed.py $dir 2.0.0-rc.2 "updater-test/update-server/latest.json" --local-loopback
          if ($LASTEXITCODE -ne 0) { throw "Feed RC2 invalido." }
          $name = "BZtune-Setup-v2.0.0-rc.2-x64.exe"
          Copy-Item "$dir/$name" "updater-test/update-server/$name"
          Copy-Item "$dir/$name.sig" "updater-test/update-server/$name.sig"
          Copy-Item "desktop/scripts/serve_update_test.ps1" "updater-test/serve_update_test.ps1"
          Copy-Item "desktop/RC2_LOCAL_UPDATE_TEST.md" "updater-test/LEIA-ME.md"
          $manifest = Get-Content "updater-test/update-server/latest.json" -Raw | ConvertFrom-Json
          if ($manifest.version -ne "2.0.0-rc.2" -or
              $manifest.platforms.'windows-x86_64'.url -ne "http://127.0.0.1:8765/$name") {
            throw "Arquivo latest.json apontando para destino incorreto."
          }

      - name: Salvar pacote de teste (sem publicar Release)
        uses: actions/upload-artifact@v4
        with:
          name: BZtune-Updater-Local-RC1-to-RC2
          retention-days: 7
          if-no-files-found: error
          path: updater-test/
