name: Android - APK de teste
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'doomvault/src/mobile/**'
      - 'doomvault/src/shared/**'
      - 'doomvault/mobile.html'
      - 'doomvault/vite.mobile.config.ts'
      - 'doomvault/package*.json'
      - 'tests/mobile/**'
      - '.github/workflows/android-test.yml'
  pull_request:
    paths: ['mobile/**', 'doomvault/src/mobile/**', 'doomvault/src/shared/**', 'tests/mobile/**']
permissions:
  contents: read
concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.signing.outputs.stable }}
    timeout-minutes: 60
    env:
      NDK_VERSION: '29.0.14206865'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri
      - name: Dependências e interface
        run: |
          npm ci --prefix doomvault
          npm ci --prefix mobile
          npm --prefix doomvault run build:android
          cd doomvault && npm install --no-save --package-lock=false playwright@1.62.1
      - name: Testar interface Android
        run: |
          cd doomvault
          npx playwright install --with-deps chromium
          node node_modules/vite/bin/vite.js preview --config vite.mobile.config.ts --host 127.0.0.1 --port 1420 --strictPort > /tmp/mobile-preview.log 2>&1 &
          cd ..
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:1420/mobile.html >/dev/null && break; sleep 1; done
          node tests/mobile/android-player.cjs
          node tests/mobile/android-player-design.cjs
          node tests/mobile/android-library.cjs
          node tests/mobile/android-backup.cjs
          node tests/mobile/android-playlists.cjs
          node tests/mobile/android-playlist-picker.cjs
          node tests/mobile/android-albums.cjs
          node tests/mobile/android-artists.cjs
          node tests/mobile/android-navigation.cjs
          node tests/mobile/android-design.cjs
          node tests/mobile/android-home.cjs
          node tests/mobile/android-remaining.cjs
          node tests/mobile/android-online.cjs
      - name: SDK e APK Android 7+
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Preparar assinatura Android
        id: signing
        env:
          BZTUNE_ANDROID_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 || '' }}
          BZTUNE_ANDROID_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD || '' }}
          BZTUNE_ANDROID_CERT_SHA256: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ANDROID_PREVIEW_CERT_SHA256 || '' }}
        run: python mobile/scripts/android_signing.py --prepare "$RUNNER_TEMP/bztune-preview.jks"
      - name: Compilar APK de teste ARM 32 e 64 bits
        working-directory: mobile
        env:
          BZTUNE_ANDROID_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          BZTUNE_ANDROID_STORE_PASSWORD: ${{ steps.signing.outputs.stable == 'true' && secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD || '' }}
        run: npm run tauri -- android build --debug --apk --target aarch64 armv7 --ci
      - name: Testar fila e biblioteca no Android 7 simulado
        working-directory: mobile/src-tauri/gen/android
        run: ./gradlew :tauri-plugin-bztune-audio:testDebugUnitTest --console=plain
      - name: Sondagem real MusicBrainz (opcional)
        id: catalog_live
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        working-directory: mobile/src-tauri/gen/android
        env:
          BZTUNE_LIVE_CATALOG: '1'
        run: ./gradlew :tauri-plugin-bztune-audio:testDebugUnitTest --tests '*OnlineCatalogLiveTest' --rerun-tasks --console=plain
      - uses: actions/upload-artifact@v4
        if: steps.catalog_live.outcome == 'success'
        with:
          name: MusicBrainz-consulta-real-validada
          path: mobile/audio-plugin/android/build/reports/online-catalog-live.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Registrar resultado da sondagem
        if: always() && steps.catalog_live.outcome != 'skipped'
        shell: python
        run: |
          import os, pathlib, xml.etree.ElementTree as ET
          folder = pathlib.Path('mobile/audio-plugin/android/build')
          marker = folder / 'reports/online-catalog-live.txt'
          text = marker.read_text() if marker.exists() else 'Conexão real não confirmada.\n'
          if not marker.exists():
              report = folder / 'test-results/testDebugUnitTest/TEST-com.bztune.audio.OnlineCatalogLiveTest.xml'
              if report.exists():
                  root = ET.parse(report).getroot()
                  for failure in root.iter('failure'):
                      text += (failure.text or '')[:2400]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Sondagem MusicBrainz\n\n```text\n' + text + '\n```\n')
      - name: Testar ferramentas de assinatura
        run: |
          python -m unittest discover -s tests -p test_android_signing.py
          apk=$(find mobile/src-tauri/gen/android/app/build/outputs/apk -name '*debug.apk' -type f | head -n 1)
          python mobile/scripts/check_signing_integration.py "$apk" --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner"
      - name: Verificar APK e Android mínimo
        env:
          BZTUNE_ANDROID_CERT_SHA256: ${{ vars.ANDROID_PREVIEW_CERT_SHA256 }}
        run: |
          apk=$(find mobile/src-tauri/gen/android/app/build/outputs/apk -name '*debug.apk' -type f | head -n 1)
          test -n "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" > /tmp/bztune-apk-badging.txt
          grep "^sdkVersion:'24'" /tmp/bztune-apk-badging.txt
          unzip -l "$apk" | grep 'lib/arm64-v8a/libbztune_mobile_lib.so'
          unzip -l "$apk" | grep 'lib/armeabi-v7a/libbztune_mobile_lib.so'
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"
          if [ "${{ steps.signing.outputs.stable }}" = "true" ]; then
            python mobile/scripts/android_signing.py --verify "$apk" --apksigner "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.stable == 'true' && 'BZtune-Android-7-teste-assinatura-estavel' || 'BZtune-Android-7-debug-descartavel' }}
          path: mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remover material privado do runner
        if: always()
        run: rm -f "$RUNNER_TEMP/bztune-preview.jks"

  publish:
    name: Publicar APK com assinatura estável
    needs: apk
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Exigir certificado fixo
        env:
          STABLE: ${{ needs.apk.outputs.stable }}
        run: test "$STABLE" = "true"
      - uses: actions/download-artifact@v4
        with:
          name: BZtune-Android-7-teste-assinatura-estavel
          path: apk
      - name: Preparar APK e checksum
        shell: python
        run: |
          import hashlib, json, pathlib, shutil
          version = json.loads(pathlib.Path('mobile/package.json').read_text())['version']
          candidates = list(pathlib.Path('apk').rglob('*.apk'))
          if len(candidates) != 1:
              raise SystemExit('Era esperado exatamente um APK universal verificado.')
          destination = pathlib.Path(f'BZtune-Android-{version}.apk')
          shutil.copyfile(candidates[0], destination)
          pathlib.Path('SHA256SUMS.txt').write_text(hashlib.sha256(destination.read_bytes()).hexdigest() + '  ' + destination.name + '\n')
          with open(__import__('os').environ['GITHUB_ENV'], 'a') as env:
              env.write(f'ANDROID_VERSION={version}\n')
      - name: Publicar versão Android de teste
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "android-v$ANDROID_VERSION" "BZtune-Android-$ANDROID_VERSION.apk" SHA256SUMS.txt --target "$SOURCE_COMMIT" --title "BZtune Android $ANDROID_VERSION — teste" --notes-file mobile/RELEASE_NOTES_ANDROID.md --prerelease --latest=false
